<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOG Anime World</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b18;color:white;font-family:Arial,sans-serif}
header{padding:32px 15px;text-align:center;background:linear-gradient(120deg,#6323bc,#ed236b)}
header h1{margin:0 0 10px;font-size:34px}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:15px;background:#15152a;position:sticky;top:0}
nav a{color:white;text-decoration:none;padding:10px 15px;border-radius:20px;background:#292943}
nav a:hover{background:#7928ca}
.intro{text-align:center;padding:25px 12px}
input{display:block;width:90%;max-width:600px;margin:15px auto 30px;padding:14px;border:1px solid #454567;border-radius:10px;background:#19192f;color:white;font-size:16px}
section{max-width:1250px;margin:auto;padding:15px}
h2{border-left:5px solid #f72585;padding-left:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.card{background:#19192f;border:1px solid #30304b;border-radius:14px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-5px);border-color:#f72585}
.card img{width:100%;height:260px;object-fit:cover;display:block;background:#252542}
.info{padding:13px}
.info h3{margin:5px 0 10px}
.info p{color:#c3c3d8;font-size:14px;line-height:1.5}
.tag{font-size:12px;color:#efa9ff}
.btn{display:inline-block;background:linear-gradient(120deg,#7928ca,#f72585);color:white;padding:9px 12px;border-radius:8px;text-decoration:none}
footer{text-align:center;padding:30px;color:#bbb;background:#15152a;margin-top:40px}
.empty{color:#ccc;text-align:center;grid-column:1/-1}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:190px}.info{padding:9px}.info h3{font-size:15px}}
</style>
</head>
<body>

<header>
<h1>⚡ JOG Anime World ⚡</h1>
<p>Entre dans la légende, vis ta passion !</p>
</header>

<nav>
<a href="#accueil">Accueil</a>
<a href="#animes">Animes</a>
<a href="#jeux">Jeux vidéo</a>
</nav>

<div class="intro" id="accueil">
<h2>Bienvenue dans ton univers !</h2>
<p>Découvre des animes et des jeux vidéo.</p>
</div>

<input id="search" type="search" placeholder="🔎 Rechercher un anime ou un jeu...">

<section id="animes">
<h2>🔥 Animes</h2>
<div class="grid" id="animeGrid"></div>
</section>

<section id="jeux">
<h2>🎮 Jeux vidéo</h2>
<div class="grid" id="gameGrid"></div>
</section>

<footer>
<strong>JOG Anime World</strong>
<p>Les images et marques appartiennent à leurs propriétaires respectifs.</p>
</footer>

<script>
const animes=[
{
name:"Blue Lock",
tag:"Football • Sport",
desc:"Des attaquants se battent pour devenir le meilleur buteur du Japon.",
img:"https://upload.wikimedia.org/wikipedia/en/4/4e/Blue_Lock_manga_volume_1.png",
url:"https://bluelock-anime-en.com/"
},
{
name:"Naruto",
tag:"Ninja • Aventure",
desc:"Suis les aventures de Naruto sur le chemin du ninja.",
img:"https://upload.wikimedia.org/wikipedia/en/9/94/NarutoCoverTankobon1.jpg",
url:"https://naruto-official.com/"
},
{
name:"One Piece",
tag:"Pirates • Aventure",
desc:"Luffy et son équipage recherchent le trésor légendaire.",
img:"https://upload.wikimedia.org/wikipedia/en/0/09/OnePieceMangaVolume1.jpg",
url:"https://one-piece.com/"
},
{
name:"Dragon Ball",
tag:"Combat • Aventure",
desc:"Découvre les combats de Goku et de ses amis.",
img:"https://upload.wikimedia.org/wikipedia/en/c/c9/Dragon_Ball_Volume_1.jpg",
url:"https://dragon-ball-official.com/"
},
{
name:"Demon Slayer",
tag:"Action • Fantastique",
desc:"Tanjiro se lance dans une aventure pour protéger sa famille.",
img:"https://upload.wikimedia.org/wikipedia/en/9/9e/Kimetsu_no_Yaiba_volume_1_cover.jpg",
url:"https://demonslayer-anime.com/"
},
{
name:"My Hero Academia",
tag:"Super-héros • Action",
desc:"Des élèves apprennent à devenir des héros.",
img:"https://upload.wikimedia.org/wikipedia/en/5/5a/My_Hero_Academia_Volume_1.png",
url:"https://heroaca.com/"
}
];

const games=[
{
name:"Minecraft",
tag:"Création • Aventure",
desc:"Construis et explore un monde à ta manière.",
img:"https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png",
url:"https://www.minecraft.net/"
},
{
name:"Rocket League",
tag:"Sport • Voitures",
desc:"Joue au football avec des voitures.",
img:"https://upload.wikimedia.org/wikipedia/en/e/e0/Rocket_League_coverart.jpg",
url:"https://www.rocketleague.com/"
},
{
name:"Genshin Impact",
tag:"RPG • Aventure",
desc:"Explore un monde fantastique plein de mystères.",
img:"https://upload.wikimedia.org/wikipedia/en/5/5d/Genshin_Impact_cover.jpg",
url:"https://genshin.hoyoverse.com/"
},
{
name:"Fortnite",
tag:"Action • Multijoueur",
desc:"Découvre les aventures et modes de jeu de Fortnite.",
img:"https://upload.wikimedia.org/wikipedia/en/0/09/Fortnite_cover_art.jpg",
url:"https://www.fortnite.com/"
}
];

function createCard(item){
const card=document.createElement("article");
card.className="card";

const img=document.createElement("img");
img.src=item.img;
img.alt="Image de "+item.name;
img.loading="lazy";

img.onerror=function(){
this.onerror=null;
this.src="https://placehold.co/400x600/19192f/ffffff?text="+encodeURIComponent(item.name);
};

const info=document.createElement("div");
info.className="info";

const tag=document.createElement("span");
tag.className="tag";
tag.textContent=item.tag;

const title=document.createElement("h3");
title.textContent=item.name;

const desc=document.createElement("p");
desc.textContent=item.desc;

const link=document.createElement("a");
link.className="btn";
link.href=item.url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Découvrir ↗";

info.append(tag,title,desc,link);
card.append(img,info);
return card;
}

function render(){
const term=document.getElementById("search").value.toLowerCase().trim();
const animeGrid=document.getElementById("animeGrid");
const gameGrid=document.getElementById("gameGrid");

animeGrid.replaceChildren();
gameGrid.replaceChildren();

const filteredAnime=animes.filter(x=>
(x.name+" "+x.tag+" "+x.desc).toLowerCase().includes(term)
);
const filteredGames=games.filter(x=>
(x.name+" "+x.tag+" "+x.desc).toLowerCase().includes(term)
);

filteredAnime.forEach(x=>animeGrid.appendChild(createCard(x)));
filteredGames.forEach(x=>gameGrid.appendChild(createCard(x)));

if(!filteredAnime.length) animeGrid.innerHTML='<p class="empty">Aucun anime trouvé.</p>';
if(!filteredGames.length) gameGrid.innerHTML='<p class="empty">Aucun jeu trouvé.</p>';
}

document.getElementById("search").addEventListener("input",render);
render();
</script>

</body>
</html>
